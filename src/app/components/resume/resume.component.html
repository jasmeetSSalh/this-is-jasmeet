<div class="section-container">
  <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-6 mb-10">
    <h2 class="section-title mb-0">Resume</h2>
    <div class="flex flex-wrap gap-3">
      <a [href]="viewUrl" target="_blank" rel="noopener" class="btn-primary">Open in new tab</a>
      <a [href]="downloadUrl" class="btn-secondary">Download PDF</a>
    </div>
  </div>

  <!-- Always the latest version from Google Drive -->
  <div class="rounded-xl overflow-hidden border border-white/10 bg-gray-900">
    <iframe [src]="previewUrl"
            class="block w-full h-[80vh] min-h-[480px]"
            title="Jasmeet Salh's resume"
            loading="lazy"
            allow="autoplay"></iframe>
  </div>
</div>
