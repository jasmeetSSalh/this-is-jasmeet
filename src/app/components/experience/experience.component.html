<div class="section-container">
  <h2 class="section-title">Experience</h2>

  <div class="space-y-4">
    @for (role of roles; track role.title + role.dates) {
      <article class="card">
        <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-1">
          <h3 class="text-lg font-semibold text-white">{{ role.title }}</h3>
          <span class="text-sm text-gray-400 sm:whitespace-nowrap">{{ role.dates }}</span>
        </div>
        <p class="text-sky-400 font-medium mt-1">{{ role.company }}</p>
        <p class="text-gray-300 leading-relaxed mt-3">{{ role.summary }}</p>
        <div class="flex flex-wrap gap-2 mt-4">
          @for (item of role.tech; track item) {
            <span class="chip">{{ item }}</span>
          }
        </div>
      </article>
    }
  </div>

  <h3 class="section-subtitle mt-16">Education</h3>
  <article class="card">
    <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-1">
      <h4 class="text-lg font-semibold text-white">BSc in Computer Science, Co-op</h4>
      <span class="text-sm text-gray-400 sm:whitespace-nowrap">Sep 2022 – Apr 2027</span>
    </div>
    <p class="text-sky-400 font-medium mt-1">Toronto Metropolitan University</p>
  </article>
</div>
